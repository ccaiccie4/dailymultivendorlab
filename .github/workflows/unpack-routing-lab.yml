name: Unpack Routing Lab HTML

on:
  push:
    branches: [main]
    paths:
      - 'docs/Daily_Multivendor_Routing_Lab_2026-08-29-08-11.html'
      - '.github/workflows/unpack-routing-lab.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace wrapper with plain HTML
        shell: python
        run: |
          from pathlib import Path
          import re, base64, gzip
          p = Path('docs/Daily_Multivendor_Routing_Lab_2026-08-29-08-11.html')
          s = p.read_text(encoding='utf-8')
          m = re.search(r'const b=`([^`]+)`', s, re.S)
          if not m:
              print('Already plain HTML; nothing to do.')
              raise SystemExit(0)
          raw = gzip.decompress(base64.b64decode(m.group(1))).decode('utf-8')
          if '50-Question Cumulative' not in raw or raw.count('Check Answer</button>') != 50:
              raise SystemExit('Decoded workbook failed validation')
          p.write_text(raw, encoding='utf-8')
          print(f'Wrote plain HTML: {len(raw)} chars')
      - name: Commit plain HTML
        run: |
          if git diff --quiet -- docs/Daily_Multivendor_Routing_Lab_2026-08-29-08-11.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/Daily_Multivendor_Routing_Lab_2026-08-29-08-11.html
          git commit -m "Replace routing lab wrapper with plain HTML"
          git push
