name: Publish Full Interactive Routing Lab HTML

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unpack-routing-lab.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble exact interactive HTML
        shell: python
        run: |
          from pathlib import Path
          parts = [Path(f'staging/0829_full_{i:02d}.part') for i in range(10)]
          missing = [str(p) for p in parts if not p.exists()]
          if missing:
              raise SystemExit(f'Missing staged parts: {missing}')
          html = ''.join(p.read_text(encoding='utf-8') for p in parts)
          checks = {
              'plain html': html.startswith('<!DOCTYPE html>'),
              'timestamp': '2026-08-29-08-11' in html,
              'lessons': html.count('class="lesson"') == 21,
              'questions': html.count('Check Answer</button>') == 50,
              'grading': 'function grade()' in html and 'Submit / Grade' in html,
              'source urls': html.count('<a href="https://') >= 25,
              'image urls': html.count('Original image URL:') >= 7,
              'no wrapper': 'DecompressionStream' not in html and 'gzip' not in html and 'const b64=' not in html,
          }
          bad=[k for k,v in checks.items() if not v]
          if bad:
              raise SystemExit(f'Validation failed: {bad}')
          dst=Path('docs/Daily_Multivendor_Routing_Lab_2026-08-29-08-11.html')
          dst.write_text(html, encoding='utf-8')
          print(f'Wrote {len(html)} characters; all validation checks passed')
      - name: Commit full interactive HTML
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/Daily_Multivendor_Routing_Lab_2026-08-29-08-11.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Publish full interactive routing lab HTML 2026-08-29-08-11"
          git push
