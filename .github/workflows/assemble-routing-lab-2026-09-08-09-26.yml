name: Assemble Routing Lab 2026-09-08-09-26
on:
  push:
    paths:
      - '.lab_build/2026-09-08-09-26.ready'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and validate exact canonical HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,hashlib,re,json
          prefix='2026-09-08-09-26'
          target_sha='6fb75a69b437c32fdee1cec39341fbdc73520d749c0649b396d1df6559d0c6de'
          parts=sorted(Path('.lab_build').glob(prefix+'.seg-*'))
          assert len(parts)==4, parts
          encoded=''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          raw=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert len(raw)==92889, len(raw)
          assert hashlib.sha256(raw).hexdigest()==target_sha
          t=raw.decode('utf-8')
          required=['run-timestamp\" content=\"2026-09-08-09-26','lesson-count\" content=\"21','beginner-foundation-count\" content=\"21','question-count\" content=\"50','30-day-uniqueness\" content=\"PASS','unique-question-fingerprints\" content=\"50/50','repeated-stem-templates\" content=\"0','repeated-correct-answer-action-patterns\" content=\"0','generic-troubleshooting-shell-questions\" content=\"0','question-order\" content=\"Q1-Q50','function grade()','function resetExam()']
          assert not [x for x in required if x not in t]
          assert 'Math.random' not in t and 'shuffle(' not in t
          lm=re.search(r'const L=(\[.*?\]);\nconst Q=',t,re.S)
          qm=re.search(r'const Q=(\[.*?\]);\nconst checked=',t,re.S)
          assert lm and qm
          L=json.loads(lm.group(1)); Q=json.loads(qm.group(1))
          assert len(L)==21 and len(Q)==50
          assert [q['id'] for q in Q]==list(range(1,51))
          assert len({q['fingerprint'] for q in Q})==50
          assert len({q['mechanism_fingerprint'] for q in Q})==50
          Path('docs/Daily_Multivendor_Routing_Lab_2026-09-08-09-26.html').write_bytes(raw)
          print('CANONICAL_READY=YES')
          print('sha256='+target_sha)
          print('lessons=21 questions=50 unique_fingerprints=50 order=PASS shuffle=0')
          PY
      - name: Commit canonical report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/Daily_Multivendor_Routing_Lab_2026-09-08-09-26.html
          git commit -m 'Assemble canonical Daily Multivendor Routing Lab — 2026-09-08-09-26'
          git push
