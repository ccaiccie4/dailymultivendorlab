name: Build beginner-first Daily Multivendor Routing Lab 2026-08-30-19-22
on:
  push:
    paths:
      - '.lab_build/rebuild_beginner_2026-08-30-19-22.py'
      - '.github/workflows/assemble-routing-lab-2026-08-30-19-22.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct generic cumulative-exam selector
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.lab_build/rebuild_beginner_2026-08-30-19-22.py')
          s=p.read_text()
          old="""exam=s.find('<section class=\"card\"><h2>Cumulative 50-question exam</h2>')\nif exam<0: exam=s.find('<section class=\"card\"><h2>Cumulative exam</h2>')\nif exam<0: raise SystemExit('Exam section not found')"""
          new="""em=re.search(r'<section class=\"card\"><h2>[^<]*Cumulative[^<]*</h2>',s,re.I)\nexam=em.start() if em else -1\nif exam<0: raise SystemExit('Exam section not found')"""
          if old not in s:
              raise SystemExit('Expected selector block not found in build script')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Rebuild from the same 18-59 source report
        run: python .lab_build/rebuild_beginner_2026-08-30-19-22.py
      - name: Validate canonical HTML
        shell: bash
        run: |
          set -euo pipefail
          TARGET=docs/Daily_Multivendor_Routing_Lab_2026-08-30-19-22.html
          test -s "$TARGET"
          grep -q '2026-08-30-19-22' "$TARGET"
          grep -Eq 'name="lesson-count" content="21"|content="21" name="lesson-count"' "$TARGET"
          grep -Eq 'name="question-count" content="50"|content="50" name="question-count"' "$TARGET"
          test "$(grep -o 'Beginner foundation — terms you need before this lesson' "$TARGET" | wc -l)" -eq 21
          grep -q 'function gradeAll' "$TARGET"
          grep -q 'function resetExam' "$TARGET"
          grep -q 'Original image URL:' "$TARGET"
          ! grep -qi 'gzip' "$TARGET"
          ! grep -qi 'base64' "$TARGET"
      - name: Publish generated report
        shell: bash
        run: |
          set -euo pipefail
          TARGET=docs/Daily_Multivendor_Routing_Lab_2026-08-30-19-22.html
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$TARGET"
          git commit -m 'Publish Daily Multivendor Routing Lab 2026-08-30-19-22' || exit 0
          git push
