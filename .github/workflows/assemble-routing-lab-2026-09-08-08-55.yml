name: Assemble Routing Lab 2026-09-08-08-55
on:
  push:
    paths:
      - '.lab_build/2026-09-08-08-55.ready'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode canonical HTML with exact hash gate
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,hashlib,traceback
          target_sha='63feff39ab563c4916e3818d24745fb98e1758ba185e58f8bdd615579eacc304'
          debug=[]
          parts=sorted(Path('.lab_build').glob('2026-09-08-08-55.seg-*'))
          debug.append('parts='+repr([(x.name,x.stat().st_size) for x in parts]))
          try:
              encoded=''.join(x.read_text(encoding='utf-8').strip() for x in parts)
              debug.append('encoded_len='+str(len(encoded)))
              packed=base64.b64decode(encoded,validate=True)
              debug.append('packed_len='+str(len(packed)))
              raw=gzip.decompress(packed)
              sha=hashlib.sha256(raw).hexdigest()
              debug.append('raw_len='+str(len(raw)))
              debug.append('raw_sha='+sha)
              if len(raw)==170669 and sha==target_sha:
                  t=raw.decode('utf-8')
                  required=['run-timestamp" content="2026-09-08-08-55','lesson-count" content="21','beginner-foundation-count" content="21','question-count" content="50','30-day-uniqueness" content="PASS','unique-question-fingerprints" content="50/50','repeated-stem-templates" content="0','repeated-correct-answer-action-patterns" content="0','generic-troubleshooting-shell-questions" content="0','question-order" content="Q1-Q50']
                  missing=[x for x in required if x not in t]
                  debug.append('missing_markers='+repr(missing))
                  debug.append('beginner_count='+str(t.count('Beginner foundation — terms you need before this lesson')))
                  main_script=t.split('<script>')[-1].split('</script>')[0]
                  debug.append('shuffle_js='+str('shuffle(' in main_script or 'Math.random' in main_script))
                  if not missing and t.count('Beginner foundation — terms you need before this lesson')==21 and 'function gradeAll()' in t and 'shuffle(' not in main_script and 'Math.random' not in main_script:
                      Path('docs/Daily_Multivendor_Routing_Lab_2026-09-08-08-55.html').write_bytes(raw)
                      debug.append('CANONICAL_READY=YES')
                  else:
                      debug.append('CANONICAL_READY=NO_MARKER_GATE')
              else:
                  debug.append('CANONICAL_READY=NO_HASH_GATE')
          except Exception as e:
              debug.append('ERROR='+repr(e))
              debug.append(traceback.format_exc())
          Path('.lab_build/2026-09-08-08-55.debug.txt').write_text('\n'.join(debug)+'\n',encoding='utf-8')
          print('\n'.join(debug))
          PY
      - name: Commit result/debug
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .lab_build/2026-09-08-08-55.debug.txt
          if [ -f docs/Daily_Multivendor_Routing_Lab_2026-09-08-08-55.html ]; then git add docs/Daily_Multivendor_Routing_Lab_2026-09-08-08-55.html; fi
          git commit -m 'Assemble Daily Multivendor Routing Lab — 2026-09-08-08-55'
          git push
