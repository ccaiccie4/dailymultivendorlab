name: Assemble Routing Lab 2026-09-10-08-32
on:
  push:
    paths:
      - '.lab_build/2026-09-10-08-32.ready'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and validate exact canonical HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,hashlib,re,json
          prefix='2026-09-10-08-32'
          target_sha='512da04c71683e4d7b2c2cd91a22c3f3f59ef064a288fadc620c6847756a66fa'
          parts=[Path('.lab_build/'+prefix+f'.seg-{i:02d}') for i in range(4)]
          assert [p.stat().st_size for p in parts]==[9968,9968,9968,9968]
          encoded=''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          assert len(encoded)==39872
          raw=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert len(raw)==117098
          assert hashlib.sha256(raw).hexdigest()==target_sha
          t=raw.decode('utf-8')
          required=['run-timestamp\" content=\"2026-09-10-08-32','lesson-count\" content=\"21','beginner-foundation-count\" content=\"21','question-count\" content=\"50','30-day-uniqueness\" content=\"PASS','question-order\" content=\"Q1-Q50','unique-question-fingerprints\" content=\"50/50','repeated-stem-templates\" content=\"0','repeated-correct-answer-action-patterns\" content=\"0','generic-troubleshooting-shell-questions\" content=\"0','function gradeAll()','function resetExam()']
          missing=[x for x in required if x not in t]
          assert not missing, missing
          assert t.count('<article class="lesson"')==21
          assert t.count('Beginner foundation — terms you need before this lesson')==21
          assert 'Math.random' not in t and 'shuffle(' not in t
          assert 'atob(' not in t and 'gzip.decompress' not in t
          qm=re.search(r'const DATA=(\[.*?\]); const checked=',t,re.S)
          assert qm
          Q=json.loads(qm.group(1))
          assert len(Q)==50
          assert [q['id'] for q in Q]==list(range(1,51))
          assert len({q['fingerprint'] for q in Q})==50
          assert len({q['mechanism_fingerprint'] for q in Q})==50
          Path('docs/Daily_Multivendor_Routing_Lab_2026-09-10-08-32.html').write_bytes(raw)
          print('CANONICAL_READY=YES')
          print('sha256='+target_sha)
          print('lessons=21 beginner=21 questions=50 fingerprints=50 mechanisms=50 order=PASS shuffle=0')
          PY
      - name: Commit canonical report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/Daily_Multivendor_Routing_Lab_2026-09-10-08-32.html
          git diff --cached --quiet && exit 0
          git commit -m 'Assemble canonical Daily Multivendor Routing Lab — 2026-09-10-08-32'
          git push
