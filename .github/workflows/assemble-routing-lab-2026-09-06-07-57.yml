name: Assemble Routing Lab 2026-09-06-07-57
on:
  push:
    branches: [main]
    paths:
      - '.lab_build/2026-09-06-07-57.ready'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble generator and build canonical plain HTML
        run: |
          sudo mkdir -p /mnt/data
          sudo chown "$USER" /mnt/data
          python - <<'PY'
          from pathlib import Path
          base=Path('.lab_build')
          parts=[]
          parts.append((base/'2026-09-06-07-57.py.part-00').read_text(encoding='utf-8')[:15000])
          parts.append((base/'2026-09-06-07-57.py.part-01').read_text(encoding='utf-8')[:15000])
          for n in range(2,7):
              parts.append((base/f'2026-09-06-07-57.py.part-{n:02d}').read_text(encoding='utf-8'))
          script=''.join(parts)
          assert len(script)==72507, len(script)
          (base/'2026-09-06-07-57.build.py').write_text(script,encoding='utf-8')
          PY
          python .lab_build/2026-09-06-07-57.build.py
      - name: Revalidate canonical workbook
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/Daily_Multivendor_Routing_Lab_2026-09-06-07-57.html')
          t=p.read_text(encoding='utf-8')
          assert p.stat().st_size == 128441, p.stat().st_size
          assert "run-timestamp' content='2026-09-06-07-57" in t
          assert "lesson-count' content='21" in t
          assert "beginner-foundation-count' content='21" in t
          assert "question-count' content='50" in t
          assert "30-day-uniqueness' content='PASS" in t
          assert "unique-question-fingerprints' content='50/50" in t
          assert "repeated-stem-templates' content='0" in t
          assert "repeated-correct-answer-action-patterns' content='0" in t
          assert "generic-troubleshooting-shells' content='0" in t
          assert t.count('Beginner foundation — terms you need before this lesson') == 21
          assert 'Question order Q1→Q50' in t
          assert 'function gradeAll()' in t and 'function checkQ' in t
          assert 'shuffle(' not in t and 'Math.random' not in t
          assert 'Which troubleshooting approach best matches this lesson?' not in t
          assert 'Which observation should be checked first?' not in t
          assert 'Which state boundary failed?' not in t
          assert 'Verify the feature-specific state' not in t
          assert 'atob(' not in t.lower() and 'gzip' not in t.lower() and 'base64' not in t.lower()
          print('canonical validation PASS', p.stat().st_size)
          PY
      - name: Commit canonical report and remove staging transport
        run: |
          rm -f .lab_build/2026-09-06-07-57.py.part-* .lab_build/2026-09-06-07-57.build.py .lab_build/2026-09-06-07-57.ready
          rm -f .github/workflows/assemble-routing-lab-2026-09-06-07-57.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Daily Multivendor Routing Lab — 2026-09-06-07-57'
          git push
